  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");
    const searchInput = document.querySelector(".search-input");
    const searchIcon = document.querySelector(".search-icon");

    // Toggle navigation menu visibility
    menuToggle.addEventListener("click", (e) => {
      e.stopPropagation(); // Prevent click from bubbling up
      navLinks.classList.toggle("show");
    });

    // Toggle search input visibility
    searchIcon.addEventListener("click", (e) => {
      e.stopPropagation(); // Prevent click from bubbling up
      searchInput.classList.toggle("show");
    });

    // Hide nav menu and search input when clicking outside
    document.addEventListener("click", () => {
      navLinks.classList.remove("show"); // Hide nav menu
      searchInput.classList.remove("show"); // Hide search input
    });

    // Prevent hiding when clicking inside nav menu or search input
    navLinks.addEventListener("click", (e) => e.stopPropagation());
    searchInput.addEventListener("click", (e) => e.stopPropagation());
  </script>
